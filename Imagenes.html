<!DOCTYPE html> <!-- Indica al navegador que el documento usa HTML5 -->
<html lang="en"> <!-- Elemento raíz; define el idioma de la página (inglés) -->
<head> <!-- Contenedor de metadatos no visibles en la página -->
    <meta charset="UTF-8"> <!-- Permite tildes, ñ y caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla a celulares -->
    <title>Imagenes en HTML</title> <!-- Texto de la pestaña del navegador -->
</head> <!-- Cierre de la sección de metadatos -->
<body> <!-- Contenedor del contenido visible de la página -->

    <h2>Imagenes en HTML</h2> <!-- Subtítulo principal de la página -->

    <h3>Locales</h3> <!-- Subtítulo de nivel 3 -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- src: ruta del archivo local | alt: texto alternativo si no carga la imagen -->

    <h3>Locales redismensionado</h3> <!-- Subtítulo de nivel 3 -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- width y height: definen ancho y alto de la imagen en píxeles -->

    <h3>Desde internet</h3> <!-- Subtítulo de nivel 3 -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" width="200" height="200" alt=""> <!-- Carga una imagen externa mediante su enlace URL -->

    <h3>Animaciones</h3> <!-- Subtítulo de nivel 3 -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" width="200" height="200" alt=""> <!-- Las imágenes animadas (GIF) se insertan usando la misma etiqueta <img> -->

</body> <!-- Cierre del contenido visible -->
</html> <!-- Cierre del documento HTML -->
