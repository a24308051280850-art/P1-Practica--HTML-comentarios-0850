<!DOCTYPE html> <!-- Indica al navegador que el documento usa HTML5 -->
<html lang="en"> <!-- Elemento raíz; define el idioma de la página (inglés) -->
<head> <!-- Contenedor de metadatos no visibles en la página -->
    <meta charset="UTF-8"> <!-- Permite tildes, ñ y caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla a celulares -->
    <title>Enlaces en HTML</title> <!-- Texto de la pestaña del navegador -->
</head> <!-- Cierre de la sección de metadatos -->
<body> <!-- Contenedor del contenido visible de la página -->

    <h2>Tipos de enlaces en HTML</h2> <!-- Subtítulo principal -->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio.</strong></p> <!-- Párrafo con texto en negrita -->

    <!-- ENLACES INTERNOS (A archivos locales) -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br> <!-- Enlace básico (se abre en la misma pestaña por defecto) -->
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br> <!-- target="_self": Abre el enlace en la misma pestaña -->
    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br> <!-- target="_blank": Abre el enlace en una nueva pestaña -->
    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br> <!-- target="_parent": Abre el enlace en el marco padre (uso con iframes) -->
    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br> <!-- target="_top": Cancela todos los marcos y abre el enlace en toda la ventana -->

    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p> <!-- Párrafo con texto en negrita -->

    <!-- ENLACES EXTERNOS (A sitios web de internet) -->
    <a href="https://www.google.com/">Google</a><br> <!-- Enlace a web externa mediante URL completa (https://) -->
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br> <!-- Abre la web externa en la misma pestaña -->
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br> <!-- Abre la web externa en una ventana/pestaña nueva -->
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br> <!-- Abre la web en el marco padre -->
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br> <!-- Abre la web ocupando todo el cuerpo del navegador -->

</body> <!-- Cierre del contenido visible -->
</html> <!-- Cierre del documento HTML -->
