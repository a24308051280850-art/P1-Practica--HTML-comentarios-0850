<!DOCTYPE html> <!-- Indica al navegador que el documento usa HTML5 -->
<html lang="en"> <!-- Elemento raíz; define el idioma de la página (inglés) -->
<head> <!-- Contenedor de metadatos no visibles en la página -->
    <meta charset="UTF-8"> <!-- Permite tildes, ñ y caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla a celulares -->
    <title>Salto de linea en HTML</title> <!-- Texto de la pestaña del navegador -->
</head> <!-- Cierre de la sección de metadatos -->
<body> <!-- Contenedor del contenido visible de la página -->

    <h1>Lenguaje de programacion</h1> <!-- Encabezado principal de la página -->
    <p>En la actualidad se utilizan diferentes lenguajes de programacion tanto en el desarrollo web, desarrollo movil, entrenamiento de inteligencia artificial, pero los mas usados son los siguientes:<br> <!-- <br>: Fuerza un salto de línea sin crear un nuevo párrafo -->
        Dart<br> <!-- Salto de línea hacia el siguiente texto -->
        Flutter<br> <!-- Salto de línea -->
        Python<br> <!-- Salto de línea -->
        Ruby<br> <!-- Salto de línea -->
        Java<br> <!-- Salto de línea -->
        TypeScript<br> <!-- Salto de línea final -->
    </p> <!-- Cierre del párrafo -->

</body> <!-- Cierre del contenido visible -->
</html> <!-- Cierre del documento HTML -->
