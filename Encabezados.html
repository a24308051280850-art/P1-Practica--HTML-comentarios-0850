<!DOCTYPE html> <!-- Indica al navegador que el documento usa HTML -->
<html lang="en"> <!-- Es el idioma de la página -->
<head> <!-- Contenedor de metadatos no visibles en la página -->
    <meta charset="UTF-8"> <!-- Para que se vean los acentos, ñ y caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta el diseño a pantallas móviles -->
    <title>Encabezados HTML</title> <!-- Título que aparece en la pestaña del navegador -->
</head> <!-- Cierre de la sección de metadatos -->
<body> <!-- Se abre lo que se ve en la página -->
    <h1>Titulo 1</h1> <!-- Título principal-->
    <h2>Titulo 2</h2> <!-- Subtítulo principal -->
    <h3>Titulo 3</h3> <!-- Subtítulo de nivel 3 -->
    <h4>Titulo 4</h4> <!-- Subtítulo de nivel 4 -->
    <h5>Titulo 5</h5> <!-- Subtítulo de nivel 5 -->
    <h6>Titulo 6</h6> <!-- Encabezado de menor jerarquía -->
</body> <!-- Se cierra lo que se ve en la pagina -->
</html> <!-- Se cierra el documento HTML -->
